<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แนะนำอาหารไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Colors */
    --color-deep-forest: #00473c;
    --color-lime-glow: #e6ff55;
    --color-sage-mist: #d8e5d6;
    --color-warm-sand: #e8dcc6;
    --color-cream-canvas: #f4f3e7;
    --color-forest-shadow: #0e150e;
    --color-warm-gray: #8c8c82;
    --color-slate-gray: #555555;

    /* Typography (Kanit substitutes for SweetSans/Grenette — geometric + Thai-capable) */
    --font-display: 'Kanit', ui-sans-serif, system-ui, sans-serif;
    --font-body: 'Kanit', ui-sans-serif, system-ui, sans-serif;

    /* Radii */
    --radius-cards: 24px;
    --radius-badges: 20px;
    --radius-images: 20px;
    --radius-buttons: 9999px;

    --shadow-xl: rgba(14, 21, 14, 0.4) 3px 3px 32px -10px;
    --page-max-width: 1100px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--color-cream-canvas);
    color: var(--color-forest-shadow);
    font-family: var(--font-body);
    font-weight: 400;
  }

  .container {
    max-width: var(--page-max-width);
    margin: 0 auto;
    padding-inline: 24px;
  }

  .band { padding-block: 56px; }
  .band-cream { background: var(--color-cream-canvas); }
  .band-sage { background: var(--color-sage-mist); }
  .band-sand { background: var(--color-warm-sand); }
  .band-forest { background: var(--color-deep-forest); color: var(--color-cream-canvas); }

  .eyebrow {
    display: block;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--color-deep-forest);
    margin: 0 0 12px;
  }

  /* Hero */
  .hero {
    background: url('tomyum-goong.jpg') center/cover no-repeat;
    position: relative;
  }

  .hero .container {
    display: flex;
    align-items: flex-end;
    min-height: 420px;
    padding-block: 32px;
  }

  .hero-overlay {
    background: rgba(244, 243, 231, 0.92);
    border-radius: var(--radius-cards);
    padding: 32px;
    max-width: 480px;
  }

  .hero-overlay h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
    color: var(--color-forest-shadow);
  }

  .hero-overlay .subtitle {
    font-family: var(--font-body);
    font-weight: 200;
    font-size: clamp(1.05rem, 2.6vw, 1.35rem);
    letter-spacing: -0.01em;
    color: var(--color-slate-gray);
    margin: 0 0 24px;
  }

  /* Buttons */
  .btn-cta {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.017em;
    color: var(--color-forest-shadow);
    background: var(--color-lime-glow);
    border: none;
    border-radius: var(--radius-buttons);
    padding: 16px 32px;
    cursor: pointer;
    box-shadow: var(--shadow-xl);
    transition: transform 0.15s ease;
  }

  .btn-cta:hover { transform: translateY(-2px); }
  .btn-cta:active { transform: translateY(0); }

  .random-result-wrap {
    max-width: 320px;
    margin: 40px auto 0;
    text-align: left;
    animation: pop 0.25s ease;
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  /* Section heading */
  section h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    line-height: 1;
    margin: 0 0 24px;
    color: var(--color-forest-shadow);
  }

  /* Search */
  .search-bar { margin-bottom: 16px; }

  .search-bar input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 16px;
    padding: 12px 20px;
    border-radius: var(--radius-buttons);
    border: 2px solid var(--color-warm-gray);
    background: #fff;
    color: var(--color-forest-shadow);
  }

  .search-bar input:focus {
    outline: none;
    border-color: var(--color-deep-forest);
  }

  /* Filter pills */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 32px;
  }

  .filter-btn {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.05em;
    padding: 10px 20px;
    border-radius: var(--radius-buttons);
    border: 2px solid var(--color-deep-forest);
    background: transparent;
    color: var(--color-deep-forest);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .filter-btn:hover { background: rgba(0, 71, 60, 0.08); }

  .filter-btn.active {
    background: var(--color-deep-forest);
    color: var(--color-cream-canvas);
  }

  /* Dish grid & cards — the photo is the card, no chrome */
  .dish-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 32px;
  }

  .dish-card { cursor: pointer; }

  .dish-photo {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: var(--radius-images);
    background: var(--color-sage-mist);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .dish-photo img { width: 100%; height: 100%; object-fit: cover; }
  .dish-photo .icon { font-size: 3.4rem; line-height: 1; }

  .heart-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(244, 243, 231, 0.85);
    border: none;
    font-size: 1.1rem;
    line-height: 1;
    color: var(--color-warm-gray);
    cursor: pointer;
    transition: color 0.15s ease, transform 0.15s ease;
    padding: 0;
  }

  .heart-btn:hover { transform: scale(1.12); }
  .heart-btn.active { color: var(--color-deep-forest); }

  .dish-card .tag {
    display: block;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--color-deep-forest);
    margin-bottom: 8px;
  }

  .dish-card h3 {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 20px;
    margin: 0 0 8px;
    color: var(--color-forest-shadow);
  }

  .dish-card p {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 16px;
    line-height: 1.3;
    color: var(--color-forest-shadow);
    margin: 0 0 16px;
  }

  .ghost-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 16px;
    color: var(--color-forest-shadow);
  }

  .dish-card:hover .ghost-link { text-decoration: underline; }

  /* Favorites section */
  .fav-section h2 { display: flex; align-items: center; gap: 8px; }

  .empty-state {
    color: var(--color-slate-gray);
    font-family: var(--font-body);
    font-size: 16px;
    text-align: center;
    padding: 32px;
    border: 2px dashed var(--color-warm-gray);
    border-radius: var(--radius-cards);
  }

  /* Footer */
  footer.band-forest { text-align: center; }
  footer.band-forest p {
    margin: 0;
    font-family: var(--font-body);
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--color-cream-canvas);
  }

  /* Dish detail overlay (acts as a detail "page") */
  .detail-overlay[hidden] { display: none; }

  .detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(14, 21, 14, 0.55);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
    z-index: 100;
  }

  .detail-page {
    background: var(--color-cream-canvas);
    border-radius: var(--radius-cards);
    max-width: 560px;
    width: 100%;
    padding: 32px;
    position: relative;
    box-shadow: var(--shadow-xl);
    animation: pop 0.2s ease;
  }

  .detail-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid var(--color-deep-forest);
    background: transparent;
    color: var(--color-deep-forest);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .detail-close:hover { background: var(--color-deep-forest); color: var(--color-cream-canvas); }

  .detail-page .dish-photo { aspect-ratio: 16 / 10; margin-bottom: 24px; }
  .detail-page .icon { font-size: 4rem; }

  .detail-page h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    line-height: 0.95;
    margin: 0 0 12px;
  }

  .detail-page .desc {
    color: var(--color-slate-gray);
    margin: 0 0 24px;
    line-height: 1.5;
    font-size: 16px;
  }

  .detail-page h3 {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--color-deep-forest);
    margin: 0 0 12px;
  }

  .ingredient-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
  }

  .ingredient-list li {
    background: var(--color-sage-mist);
    color: var(--color-deep-forest);
    border-radius: var(--radius-badges);
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 500;
    text-align: center;
  }

  @media (max-width: 640px) {
    .band { padding-block: 40px; }
    .hero .container { align-items: stretch; min-height: 360px; }
    .hero-overlay { max-width: none; }
  }

  /* Registration bar + modal */
  .auth-bar { padding-block: 12px; }
  .auth-bar-inner { display: flex; align-items: center; justify-content: flex-end; gap: 16px; flex-wrap: wrap; }
  .auth-status { font-size: 14px; font-weight: 500; }
  .btn-mini {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14px;
    color: var(--color-forest-shadow);
    background: var(--color-lime-glow);
    border: none;
    border-radius: var(--radius-buttons);
    padding: 8px 18px;
    cursor: pointer;
  }

  .auth-page { max-width: 400px; }
  .auth-page form { display: flex; flex-direction: column; gap: 16px; margin-top: 8px; }
  .auth-page label { font-size: 14px; font-weight: 500; color: var(--color-slate-gray); display: flex; flex-direction: column; gap: 6px; }
  .auth-page input {
    font-family: var(--font-body);
    font-size: 16px;
    padding: 12px 16px;
    border-radius: var(--radius-buttons);
    border: 2px solid var(--color-warm-gray);
    background: #fff;
    color: var(--color-forest-shadow);
  }
  .auth-page input:focus { outline: none; border-color: var(--color-deep-forest); }
  .auth-error { color: #b3261e; font-size: 14px; margin: 0; }
  .auth-success { color: var(--color-deep-forest); font-size: 14px; margin: 0; font-weight: 700; }
  .auth-submit { width: 100%; text-align: center; }
</style>
</head>
<body>
  <div class="band band-forest auth-bar">
    <div class="container auth-bar-inner">
      <button class="btn-mini" data-open-auth>สมัครสมาชิก</button>
    </div>
  </div>

  <section class="hero">
    <div class="container">
      <div class="hero-overlay">
        <span class="eyebrow">เลือกไม่ถูกใช่ไหม?</span>
        <h1>แนะนำอาหารไทย</h1>
        <p class="subtitle">ให้เราช่วยสุ่มเมนูเด็ดให้คุณวันนี้</p>
        <button id="randomBtn" class="btn-cta">สุ่มอาหารไทยวันนี้</button>
      </div>
    </div>
  </section>

  <section class="band band-sage">
    <div class="container">
      <div id="randomResult" class="random-result-wrap" hidden></div>
    </div>
  </section>

  <section class="band band-cream menu-section">
    <div class="container">
      <h2>เมนูอาหารไทยทั้งหมด</h2>
      <div class="search-bar">
        <input type="search" id="searchInput" placeholder="ค้นหาเมนู เช่น ผัดไทย, ต้มยำ..." aria-label="ค้นหาเมนู">
      </div>
      <div id="filterBar" class="filter-bar"></div>
      <div id="dishGrid" class="dish-grid"></div>
      <p id="searchEmpty" class="empty-state" hidden>ไม่พบเมนูที่ค้นหา ลองคำอื่นดูนะ</p>
    </div>
  </section>

  <section id="favSection" class="band band-sand fav-section" hidden>
    <div class="container">
      <h2>❤️ รายการโปรดของฉัน</h2>
      <div id="favGrid" class="dish-grid"></div>
      <p id="favEmpty" class="empty-state" hidden>ยังไม่มีเมนูโปรด ลองกดหัวใจดูสิ!</p>
    </div>
  </section>

  <footer class="band band-forest">
    <div class="container">
      <p>ทำด้วยใจ เพื่อคนเลือกอาหารไม่ถูก 🌿</p>
    </div>
  </footer>

  <div id="detailOverlay" class="detail-overlay" hidden></div>

  <div id="authOverlay" class="detail-overlay" hidden>
    <div class="detail-page auth-page" role="dialog" aria-modal="true" aria-label="สมัครสมาชิก">
      <button class="detail-close" data-close-auth aria-label="ปิด">✕</button>
      <h2>สมัครสมาชิก</h2>
      <form id="authForm">
        <label>ชื่อ-นามสกุล<input type="text" id="authName" required autocomplete="name"></label>
        <label>อีเมล<input type="email" id="authEmail" required autocomplete="email"></label>
        <label>เบอร์โทร<input type="tel" id="authPhone" required autocomplete="tel"></label>
        <p id="authError" class="auth-error" hidden></p>
        <p id="authSuccess" class="auth-success" hidden>ลงทะเบียนสำเร็จ ขอบคุณค่ะ</p>
        <button type="submit" class="btn-cta auth-submit" id="authSubmitBtn">สมัครสมาชิก</button>
      </form>
    </div>
  </div>

    { id: 11, name: 'ทับทิมกรอบ', category: 'ของหวาน', desc: 'แห้วเชื่อมคลุกแป้งสีแดงกรอบ ราดกะทิสดใส่น้ำแข็ง', icon: '🍧',
      ingredients: ['แห้ว', 'แป้งมันสำปะหลัง', 'สีผสมอาหารแดง', 'กะทิ', 'น้ำตาลทราย', 'น้ำแข็ง', 'ใบเตย'] },
    { id: 12, name: 'ไก่ทอดหาดใหญ่', category: 'ทอด', desc: 'ไก่ทอดสมุนไพรหอมเครื่องเทศ เสิร์ฟคู่ข้าวเหนียว', icon: '🍗',
      ingredients: ['เนื้อไก่', 'ตะไคร้', 'กระเทียม', 'รากผักชี', 'พริกไทย', 'ขมิ้น', 'น้ำปลา', 'แป้งทอดกรอบ'] }
  ];

  var categories = ['ผัด', 'ต้ม', 'แกง', 'ยำ', 'ทอด', 'ของหวาน'];

  var STORAGE_KEY = 'thaiFoodFavorites';
  var REVEAL_KEY = 'thaiFoodFavoritesRevealed';

  var favorites = loadFavorites();
  var currentFilter = 'all';
  var searchQuery = '';

  var randomBtn = document.getElementById('randomBtn');
  var randomResult = document.getElementById('randomResult');
  var filterBar = document.getElementById('filterBar');
  var dishGrid = document.getElementById('dishGrid');
  var searchInput = document.getElementById('searchInput');
  var searchEmpty = document.getElementById('searchEmpty');
  var favSection = document.getElementById('favSection');
  var favGrid = document.getElementById('favGrid');
  var favEmpty = document.getElementById('favEmpty');
  var detailOverlay = document.getElementById('detailOverlay');

  var SUPABASE_URL = 'https://cdtijnjouuztxlahnbxi.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkdGlqbmpvdXV6dHhsYWhuYnhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODg3MjMsImV4cCI6MjEwNTQ2NDcyM30.1ocCfw14RYiA45zE7z7Y7dWL0eR2U75oqfhRYVcvKu0';

  var authOverlay = document.getElementById('authOverlay');
  var authForm = document.getElementById('authForm');
  var authName = document.getElementById('authName');
  var authEmail = document.getElementById('authEmail');
  var authPhone = document.getElementById('authPhone');
  var authError = document.getElementById('authError');
  var authSuccess = document.getElementById('authSuccess');
  var authSubmitBtn = document.getElementById('authSubmitBtn');

  function openAuth() {
    authError.hidden = true;
    authSuccess.hidden = true;
    authForm.hidden = false;
    authForm.reset();
    authOverlay.hidden = false;
  }

  function closeAuth() {
    authOverlay.hidden = true;
  }

  authForm.addEventListener('submit', function (e) {
    e.preventDefault();
    authError.hidden = true;
    authSubmitBtn.disabled = true;
    fetch(SUPABASE_URL + '/rest/v1/members', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({
        full_name: authName.value.trim(),
        email: authEmail.value.trim(),
        phone: authPhone.value.trim()
      })
    }).then(function (res) {
      authSubmitBtn.disabled = false;
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (body) {
          authError.textContent = body.message === 'duplicate key value violates unique constraint "members_email_key"'
            ? 'อีเมลนี้ลงทะเบียนแล้ว'
            : 'เกิดข้อผิดพลาด กรุณาลองใหม่';
          authError.hidden = false;
        });
      }
      authForm.hidden = true;
      authSuccess.hidden = false;
    }).catch(function () {
      authSubmitBtn.disabled = false;
      authError.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่';
      authError.hidden = false;
    });
  });

  function loadFavorites() {
    try {
      var raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(raw) ? new Set(raw) : new Set();
    } catch (e) {
      return new Set();
    }
  }

  function saveFavorites() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(favorites)));
    } catch (e) {}
  }

  function isRevealed() {
    try { return localStorage.getItem(REVEAL_KEY) === '1'; } catch (e) { return false; }
  }

  function setRevealed() {
    try { localStorage.setItem(REVEAL_KEY, '1'); } catch (e) {}
  }

  function findDish(id) {
    for (var i = 0; i < dishes.length; i++) if (dishes[i].id === id) return dishes[i];
    return null;
  }

  function dishCardHTML(dish) {
    var active = favorites.has(dish.id) ? ' active' : '';
    var media = dish.img
      ? '<img src="' + dish.img + '" alt="' + dish.name + '" loading="lazy">'
      : '<span class="icon">' + dish.icon + '</span>';
    return (
      '<div class="dish-card" data-card-id="' + dish.id + '">' +
        '<div class="dish-photo">' +
          media +
          '<button class="heart-btn' + active + '" data-toggle-fav="' + dish.id + '" aria-label="กดถูกใจ">♥</button>' +
        '</div>' +
        '<span class="tag">' + dish.category + '</span>' +
        '<h3>' + dish.name + '</h3>' +
        '<p>' + dish.desc + '</p>' +
        '<span class="ghost-link">ดูเพิ่มเติม →</span>' +
      '</div>'
    );
  }

  function renderFilterBar() {
    var buttons = ['<button class="filter-btn' + (currentFilter === 'all' ? ' active' : '') + '" data-filter="all">ทั้งหมด</button>'];
    categories.forEach(function (cat) {
      buttons.push('<button class="filter-btn' + (currentFilter === cat ? ' active' : '') + '" data-filter="' + cat + '">' + cat + '</button>');
    });
    filterBar.innerHTML = buttons.join('');
  }

  function renderGrid() {
    var list = dishes.filter(function (d) {
      if (currentFilter !== 'all' && d.category !== currentFilter) return false;
      if (!searchQuery) return true;
      return (d.name + ' ' + d.desc).toLowerCase().indexOf(searchQuery) !== -1;
    });
    dishGrid.innerHTML = list.map(dishCardHTML).join('');
    searchEmpty.hidden = list.length !== 0;
  }

  function renderRandomResult(dish) {
    randomResult.innerHTML = dishCardHTML(dish);
    randomResult.hidden = false;
    randomResult.dataset.dishId = dish.id;
  }

  function renderFavorites() {
    var revealed = isRevealed();
    favSection.hidden = !revealed;
    if (!revealed) return;

    if (favorites.size === 0) {
      favGrid.innerHTML = '';
      favEmpty.hidden = false;
      return;
    }

    favEmpty.hidden = true;
    var favDishes = Array.from(favorites).map(findDish).filter(Boolean);
    favGrid.innerHTML = favDishes.map(dishCardHTML).join('');
  }

  function toggleFavorite(id) {
    id = Number(id);
    if (favorites.has(id)) {
      favorites.delete(id);
    } else {
      favorites.add(id);
      if (!isRevealed()) setRevealed();
    }
    saveFavorites();
    renderGrid();
    renderFavorites();
    if (randomResult.dataset.dishId && Number(randomResult.dataset.dishId) === id) {
      var dish = findDish(id);
      if (dish) renderRandomResult(dish);
    }
  }

  function renderDetailPage(dish) {
    var media = dish.img
      ? '<img src="' + dish.img + '" alt="' + dish.name + '" loading="lazy">'
      : '<span class="icon">' + dish.icon + '</span>';
    var ingredientItems = (dish.ingredients || []).map(function (item) {
      return '<li>' + item + '</li>';
    }).join('');
    detailOverlay.innerHTML =
      '<div class="detail-page" role="dialog" aria-modal="true" aria-label="รายละเอียด ' + dish.name + '">' +
        '<button class="detail-close" data-close-detail aria-label="ปิด">✕</button>' +
        '<div class="dish-photo">' + media + '</div>' +
        '<span class="tag">' + dish.category + '</span>' +
        '<h2>' + dish.name + '</h2>' +
        '<p class="desc">' + dish.desc + '</p>' +
        '<h3>ส่วนประกอบ</h3>' +
        '<ul class="ingredient-list">' + ingredientItems + '</ul>' +
      '</div>';
  }

  function openDetail(id) {
    var dish = findDish(Number(id));
    if (!dish) return;
    renderDetailPage(dish);
    detailOverlay.hidden = false;
    if (location.hash !== '#dish-' + dish.id) location.hash = 'dish-' + dish.id;
  }

  function closeDetail() {
    detailOverlay.hidden = true;
    detailOverlay.innerHTML = '';
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  }

  function syncDetailFromHash() {
    var match = /^#dish-(\d+)$/.exec(location.hash);
    if (match) {
      openDetail(match[1]);
    } else {
      closeDetail();
    }
  }

  document.addEventListener('click', function (e) {
    var heartBtn = e.target.closest('[data-toggle-fav]');
    if (heartBtn) {
      toggleFavorite(heartBtn.getAttribute('data-toggle-fav'));
      return;
    }
    var filterBtn = e.target.closest('[data-filter]');
    if (filterBtn) {
      currentFilter = filterBtn.getAttribute('data-filter');
      renderFilterBar();
      renderGrid();
      return;
    }
    if (e.target.closest('[data-close-detail]') || e.target === detailOverlay) {
      closeDetail();
      return;
    }
    if (e.target.closest('[data-open-auth]')) {
      openAuth();
      return;
    }
    if (e.target.closest('[data-close-auth]') || e.target === authOverlay) {
      closeAuth();
      return;
    }
    var card = e.target.closest('[data-card-id]');
    if (card) {
      openDetail(card.getAttribute('data-card-id'));
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !detailOverlay.hidden) closeDetail();
    if (e.key === 'Escape' && !authOverlay.hidden) closeAuth();
  });

  window.addEventListener('hashchange', syncDetailFromHash);

  randomBtn.addEventListener('click', function () {
    var dish = dishes[Math.floor(Math.random() * dishes.length)];
    renderRandomResult(dish);
  });

  searchInput.addEventListener('input', function () {
    searchQuery = searchInput.value.trim().toLowerCase();
    renderGrid();
  });

  renderFilterBar();
  renderGrid();
  renderFavorites();
  syncDetailFromHash();
})();
</script>
</body>
</html>
